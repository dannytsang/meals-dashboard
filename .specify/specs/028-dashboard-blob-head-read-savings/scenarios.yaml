# Machine-readable scenario coverage for 028-dashboard-blob-head-read-savings.
feature_id: 028-dashboard-blob-head-read-savings
scenarios:
  AS-001:
    type: positive
    requirements: [FR-001, FR-003, FR-004, NFR-001]
    expected: |
      Given a VercelBlobStorageClient with a valid token and a pointer blob at 'pointers/latest.json',
      When `readPointer()` is called,
      Then `head('pointers/latest.json', { token })` is called exactly once,
      `list()` is called exactly zero times,
      the pointer JSON body is fetched from `headResult.url`,
      and the returned PointerContents object matches the blob content.
    verification:
      automated: cd /home/hermes/workspace/meals-dashboard && npx vitest run lib/blob-storage.test.ts -v
      manual: |
        Trigger a meals-check sync. Inspect Vercel function logs for
        `/api/dashboard-sync`. Verify the log entries show a `head()` call
        for the pointer lookup and zero `list()` calls in the route handler
        invocation path.
      rationale: |
        Headline use case — readPointer uses head() instead of list(),
        saving 1 Vercel Blob Advanced Operation per sync run.
    integration_isolation: mocked @vercel/blob SDK + mocked fetch in vitest.
  AS-002:
    type: positive
    requirements: [FR-002, FR-003, FR-004, FR-005, NFR-001]
    expected: |
      Given a VercelBlobStorageClient with a valid token and a manifest blob at the path returned by `readPointer()`,
      When `readManifest(manifestPath)` is called with that path,
      Then `head(manifestPath, { token })` is called exactly once,
      `list()` is called exactly zero times,
      the manifest JSON body is fetched from `headResult.url`,
      and the returned Manifest object passes the shape validation (every value is a string).
    verification:
      automated: cd /home/hermes/workspace/meals-dashboard && npx vitest run lib/blob-storage.test.ts -v
      manual: |
        Trigger a meals-check sync. Inspect Vercel function logs for
        `/api/dashboard-sync`. Verify the log entries show a `head()` call
        for the manifest lookup and zero `list()` calls in the route handler
        invocation path. Confirm the response JSON contains a valid
        `manifestPath` field.
      rationale: |
        Headline use case — readManifest uses head() instead of list(),
        saving 1 Vercel Blob Advanced Operation per sync run.
    integration_isolation: mocked @vercel/blob SDK + mocked fetch in vitest.
  AS-003:
    type: negative
    requirements: [FR-004, FR-006, NFR-002]
    expected: |
      Given a VercelBlobStorageClient with a valid token and no pointer blob at 'pointers/latest.json' (initial sync scenario),
      When `readPointer()` is called,
      Then `head('pointers/latest.json', { token })` returns `null` (per @vercel/blob@2.4.0 source: `if (response.status === 404) return null;`),
      `readPointer()` returns `null`,
      `list()` is called exactly zero times,
      and the calling code (syncDashboardLayout) treats this as `isInitialSync = true`.
    verification:
      automated: cd /home/hermes/workspace/meals-dashboard && npx vitest run lib/blob-storage.test.ts -v
      manual: |
        Delete the pointer blob from Vercel Blob storage (or test on a fresh
        store). Trigger a sync. Verify the sync proceeds in initial-sync mode
        and writes a new pointer + manifest + data blobs. Confirm zero
        `list()` calls in the route handler log.
      rationale: |
        Null-on-miss equivalence — head() returns null on 404 the same
        way list() returns an empty array on no-match. Behavioural
        equivalence with the prior list()-based implementation.
    integration_isolation: mocked @vercel/blob SDK + mocked fetch in vitest.
  AS-004:
    type: negative
    requirements: [FR-004, FR-005]
    expected: |
      Given a VercelBlobStorageClient with a valid token and a manifest blob whose JSON content has no `manifestPath` string field (corrupt state),
      When `readPointer()` is called,
      Then `head()` returns the metadata,
      the body is fetched and parsed,
      and the validation `if (!res || typeof res.manifestPath !== 'string') return null;` returns `null`.
      No exception is raised. The calling code treats this as `isInitialSync = true`.
    verification:
      automated: cd /home/hermes/workspace/meals-dashboard && npx vitest run lib/blob-storage.test.ts -v
      manual: |
        Manually overwrite the pointer blob in Vercel Blob with invalid
        JSON (no `manifestPath` field). Trigger a sync. Verify the sync
        proceeds in initial-sync mode and rewrites the pointer.
      rationale: |
        Existing defensive validation is preserved — corrupt pointer
        JSON returns null, same as before.
    integration_isolation: mocked @vercel/blob SDK + mocked fetch in vitest.

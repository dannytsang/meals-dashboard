  FR-009:
    description: Manual override local state file keyed by meal date, meal name, item name
    user_stories: [US4]
    scenarios: [AS-004]
    tasks: [T050, T051]
    checks:
      - python3 -m unittest test_tesco_manual_override_persistence -v
      - python3 -m unittest test_tesco_pipeline_wiring -v -t "override"
    verification:
      evidence: '~/.hermes/scripts/data/manual_overrides.json with triple key; apply_manual_override with upsert logic; load_dashboard_overrides reads active entries; pipeline.dashboard_overrides_file config in tesco_config.yaml; 7 persistence cases all green; CHANGELOG 2026-06-15 Phase 6.'

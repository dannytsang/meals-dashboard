    description: Refund processing — meal status transition and refunded item display
    user_stories: [US2]
    scenarios: [AS-002]
    tasks: [T030, T031, T031b, T060]
    checks:
      - python3 -m unittest test_tesco_refund_processing -v
      - python3 -m unittest test_tesco_pipeline_wiring -v -t "refund"

      evidence: 'annotate_shelf_life in tesco_matcher.py (pure annotation pass); 5 shelf-life cases in test_tesco_shelf_life.py all green; _annotate_matched_results_with_shelf_life wired into write_dashboard_cache with 14-entry SHELF_LIFE_BY_ITEM seed table; CHANGELOG 2026-06-15 Phase 4+5 ships both chunks.'

feature_id: 019-dashboard-coverage-invalidation-refunds-perishables
requirements:
  FR-001:
    description: Coverage invalidation on any order content change
    user_stories: [US1]
    scenarios: [AS-001]
    tasks: [T020, T021]
    checks:
      - python3 -m unittest test_tesco_pipeline_wiring -v -t "invalidation"
      - python3 -m unittest test_tesco_refund_processing -v
      - vitest run lib/dashboard-sync.test.ts -t "Spec 019"
    verification:
      evidence: 'Coverage blobs written with stale:true transiently and stale:false on recalculation; 4 trigger-reason cases (order_updated/cancelled/superseded/refunded) in test_tesco_pipeline_wiring.py; audit.jsonl entries appended for each invalidation; CHANGELOG 2026-06-15 Phase 3 ships invalidateCoverageForOrder in meals-dashboard e9b096e.'
  FR-002:
    description: Coverage blob stale field and transient race-condition safety
    user_stories: [US1]
    scenarios: [AS-001]
    tasks: [T010, T022]
    checks:
      - python3 -m unittest test_tesco_pipeline_wiring -v -t "stale"
      - vitest run lib/dashboard-sync.test.ts -t "Spec 019"
    verification:
      evidence: 'normaliseSplitLayoutPayload in lib/dashboard-sync.ts enforces stale:false / staleReason:null defaults on every write; 5 Spec 019 vitest cases pass; CHANGELOG 2026-06-15 Phase 2 ships the schema defaults.'
  FR-003:
    description: Shelf-life-aware coverage matching
    user_stories: [US3]
    scenarios: [AS-003]
    tasks: [T040, T041]

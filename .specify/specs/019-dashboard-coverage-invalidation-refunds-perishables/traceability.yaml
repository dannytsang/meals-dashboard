      evidence: 'process_refund in tesco_meal_check.py (6 cases in test_tesco_refund_processing.py); wired into write_dashboard_cache with refund_amount and refunded_items fields (5 pipeline wiring cases); meal detail card shows distinct "refunded" section with £X refunded badge; 4 dashboard-client.test.ts Spec 019 cases pass; CHANGELOG 2026-06-15 Phase 4+5 ships both chunks.'
  FR-007:
    description: Manual override — persistence, audit log, and status non-upgrade
    user_stories: [US4]
    scenarios: [AS-004]
    tasks: [T050, T051, T052, T053]

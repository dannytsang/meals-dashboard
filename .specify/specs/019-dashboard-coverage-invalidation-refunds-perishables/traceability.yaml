    description: Amendment email that adds 1 new item triggers coverage recalculation
    requirements: [FR-001]
    verification:
      evidence: 'Amendment email processing in CHANGELOG 2026-06-15 Phase 3+4+5; 4 trigger-reason cases in test_tesco_pipeline_wiring.py; manual smoke T078 verified with real amendment emails.'
  SC-002:
    description: Refund email causes correct meal status transitions and refunded item display
    requirements: [FR-006]
    verification:
      evidence: '6 refund processing cases in test_tesco_refund_processing.py; 5 pipeline wiring cases; 4 real refund emails processed in 30-day live run (CHANGELOG 2026-06-15); manual smoke T079 verified; 4 Spec 019 dashboard-client cases pass for refunded section rendering.'
  SC-003:
    description: Perishable item shows "Use today" section and perishable summary badge
    requirements: [FR-003, FR-004, FR-005]
    verification:
      evidence: '5 shelf-life cases in test_tesco_shelf_life.py; 5 pipeline wiring cases; SHELF_LIFE_BY_ITEM 14-entry seed table; 4 Spec 019 dashboard-client cases pass; manual smoke T080 verified with real delivery data.'
  SC-004:
    description: Manual override persists across sync runs without auto-upgrading meal status
    requirements: [FR-007, FR-009]
    verification:
      evidence: '7 manual override persistence cases all green; upsert dedup tested; defensive guard shipped 98db6e0; manual smoke T081 verified override persists across re-sync; SC-004 Acceptance 5 (no auto-upgrade from partial to covered) tested in persistence and pipeline wiring cases.'
  SC-005:
    description: Audit log receives one entry per invalidation, refund, and override
    requirements: [FR-001, FR-006, FR-007]
    verification:

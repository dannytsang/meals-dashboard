# Machine-readable requirement traceability for 026-dashboard-user-menu.
# Validator requires FR-\d{3} keys only; NFRs live in spec.md only.
feature_id: 026-dashboard-user-menu
requirements:
  FR-001:
    title: "Trigger renders as <button> with menu ARIA"
    user_stories: [US1, US5]
    scenarios: [AS-001, AS-002, AS-003, AS-016, AS-018]
    tasks: [T005, T014, T015]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx renders <button type=\"button\"> with aria-haspopup, aria-expanded, aria-controls; dashboard-client.tsx wires <UserMenu userName={userName} debugOn={!!debugOn} /> in the action row; components/user-menu.test.tsx asserts these attributes; components/dashboard-client.test.ts asserts the new structure."
  FR-002:
    title: "Chevron-down icon next to chip text inside trigger"
    user_stories: [US1]
    scenarios: [AS-002]
    tasks: [T005, T013]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx renders lucide-react ChevronDown inside the trigger button; rotates 180° via CSS transform when open; aria-hidden=true."
  FR-003:
    title: "Dropdown panel with role='menu' and aria-labelledby"
    user_stories: [US1, US3, US5]
    scenarios: [AS-002, AS-011, AS-017, AS-018]
    tasks: [T007, T008, T009, T010, T011, T013]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx renders <div id=\"user-menu-panel\" role=\"menu\" aria-labelledby={triggerId}>; rows are <button role=\"menuitem\"> or <button role=\"menuitemcheckbox\">; identity header row is <div aria-hidden=\"true\">."
  FR-004:
    title: "Panel position absolutely below trigger, right-aligned, z-index 60"
    user_stories: [US6]
    scenarios: [AS-020]
    tasks: [T007, T013]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx sets position: absolute, top: calc(100% + 6px), right: 0, minWidth: 220px, zIndex: 60 on the panel; wrapper is position: relative; components/user-menu.test.tsx asserts these style properties."
  FR-005:
    title: "Debug menu row is always-visible and reflects the cookie via aria-checked (FR-005 Rev 2)"
    user_stories: [US2]
    scenarios: [AS-007, AS-008, AS-009]
    tasks: [T009, T009a, T014]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx renders the DebugMenuRow without a `debugOn && ...` guard; aria-checked is set from the server-rendered debugOn prop; clicking POSTs { value: '1' } when off, { value: '0' } when on (per FR-005 Rev 2, FR-013); components/user-menu.test.tsx asserts the row is present with aria-checked='false' when debugOn=false and POSTs { value: '1' } to enable, and with aria-checked='true' when debugOn=true and POSTs { value: '0' } to disable. Server-side cookie verification on each POST is preserved by spec 022 Rev 3's effectiveDebugMode helper and the /api/debug/toggle endpoint."
  FR-006:
    title: "Theme menu row reuses toggleTheme() helper"
    user_stories: [US4]
    scenarios: [AS-013]
    tasks: [T002, T010, T013]
    checks: []
    verification:
      status: proposed
      evidence: "lib/user-menu.ts exports toggleTheme(); components/theme-toggle.tsx is refactored to call toggleTheme(); components/user-menu.tsx calls toggleTheme() from ThemeMenuRow; lib/user-menu.test.ts asserts the helper behaviour; components/user-menu.test.tsx asserts the row invokes toggleTheme."
  FR-007:
    title: "Sign out menu row reuses signOut() helper"
    user_stories: [US3, US4]
    scenarios: [AS-012, AS-014]
    tasks: [T003, T011, T013]
    checks: []
    verification:
      status: proposed
      evidence: "lib/user-menu.ts exports signOut(); components/sign-out-button.tsx is refactored to call signOut(); components/user-menu.tsx calls signOut() from SignOutMenuRow; menu closes before navigation; lib/user-menu.test.ts asserts the helper behaviour; components/user-menu.test.tsx asserts the row invokes signOut."
  FR-008:
    title: "Click-outside closes the menu"
    user_stories: [US1]
    scenarios: [AS-004]
    tasks: [T006, T013]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx registers a mousedown listener on document via useEffect while open; listener checks event.target against triggerRef/panelRef and calls setOpen(false) when outside; listener is removed on close/unmount; components/user-menu.test.tsx asserts this behaviour."
  FR-009:
    title: "Escape key closes the menu and returns focus to trigger"
    user_stories: [US1, US5]
    scenarios: [AS-005]
    tasks: [T006, T012, T013]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx registers a keydown listener on document while open; on Escape calls setOpen(false) and triggerRef.current?.focus(); components/user-menu.test.tsx asserts this behaviour."
  FR-010:
    title: "Menu closes after any menu row is activated"
    user_stories: [US1, US4]
    scenarios: [AS-006]
    tasks: [T009, T010, T011, T013]
    checks: []
    verification:
      status: proposed
      evidence: "Each menu row's onClick calls setOpen(false) after invoking the underlying action; for Sign out the close happens before navigation; components/user-menu.test.tsx asserts panel hides after row click."
  FR-011:
    title: "Focus moves into menu on open and back to trigger on close"
    user_stories: [US5]
    scenarios: [AS-005, AS-015]
    tasks: [T012, T013]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx uses useRef for the first interactive row; on open focuses that ref; on close returns focus to triggerRef; components/user-menu.test.tsx asserts document.activeElement transitions correctly."
  FR-012:
    title: "Menu component is a thin client wrapper around server-rendered UserChip"
    user_stories: [US1]
    scenarios: [AS-001, AS-002]
    tasks: [T005, T013]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.tsx is marked 'use client'; it imports UserChip from '@/components/user-chip' and renders <UserChip userName={userName} /> inside its <button> trigger; UserChip's server-rendered text derivation is unchanged."
  FR-013:
    title: "Debug menu row toggle behaviour matches spec 022 (both directions, per FR-005 Rev 2)"
    user_stories: [US2]
    scenarios: [AS-008, AS-009, AS-010]
    tasks: [T001, T009, T009a, T013]
    checks: []
    verification:
      status: proposed
      evidence: "lib/user-menu.ts exports toggleDebug(); components/debug-toggle.tsx is refactored to call toggleDebug(); UserMenu's DebugMenuRow uses the same helper with optimistic update + revert on error + router.refresh() on success; disabled while pending; clicking POSTs { value: '1' } to enable (off state, per AS-008) or { value: '0' } to disable (on state, per AS-009); components/user-menu.test.tsx asserts both directions; lib/user-menu.test.ts asserts the helper."
  FR-014:
    title: "DemoModeChip remains a separate sibling, not inside the menu"
    user_stories: [US2, US6]
    scenarios: [AS-022]
    tasks: [T014, T015]
    checks: []
    verification:
      status: proposed
      evidence: "components/dashboard-client.tsx renders <DemoModeChip /> as a separate sibling of <UserMenu /> in the action row; components/dashboard-client.test.ts asserts this placement."
  FR-015:

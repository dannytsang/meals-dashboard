  FR-017:
    title: "Vitest tests for components/user-menu.test.tsx + lib/user-menu.test.ts"
    user_stories: [US1, US2, US3, US4, US5, US6]
    scenarios: [AS-001, AS-002, AS-003, AS-004, AS-005, AS-006, AS-007, AS-008, AS-009, AS-010, AS-011, AS-012, AS-013, AS-014, AS-015, AS-016, AS-017, AS-018, AS-019, AS-020]
    tasks: [T004, T009a, T013]
    checks: []
    verification:
      status: proposed
      evidence: "components/user-menu.test.tsx covers (a) trigger attributes, (b) trigger text, (c) click toggles open, (d) Escape closes, (e) click outside closes, (f) click trigger closes, (g) Debug row always present with aria-checked='false' when debugOn=false (per FR-005 Rev 2 + T009a), (h) Debug row present with aria-checked='true' when debugOn=true, (i) Debug row click POSTs { value: '1' } to enable from off state, (j) Debug row click POSTs { value: '0' } to disable from on state, (k) Theme row always present + flips, (l) Sign out row always present + navigates, (m) focus returns to trigger on Escape, (n) focus moves into menu on open. lib/user-menu.test.ts covers the three pure helpers."

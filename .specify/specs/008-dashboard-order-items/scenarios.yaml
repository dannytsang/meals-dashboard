  AS-012:
    type: manual
    requirements:
    - FR-012
    expected: Typing or deleting characters in the Order Items by Category search field immediately updates the visible item list on the client.
    verification:
      automated: Dashboard component/helper tests cover immediate search-state changes without submit or server calls.
      manual: In the dashboard, type into the Order Items by Category search field and confirm rows update per keystroke with no navigation or reload.
      rationale: The user explicitly requested client-side search that starts filtering as soon as typing begins.
    integration_isolation: Client-side UI state only; no meals-check pipeline or generated-data mutation.
  AS-013:
    type: manual
    requirements:
    - FR-013
    expected: Search, category chips, matched-state filter, sort direction, and Show all/Collapse compose into one deterministic visible item result.
    verification:
      automated: Dashboard helper tests cover search combined with active category, matched/unmatched filter, sort direction, blank-search reset, and visible-count behaviour.
      manual: Activate a category, matched/unmatched filter, sort direction, and search query; confirm visible rows are the combined intersection ordered by the chosen sort.
      rationale: Search must not become a separate mode that bypasses the existing match, sort, or category controls.
    integration_isolation: Client-side derivation over loaded receipt items only.
  AS-014:
    type: manual
    requirements:
    - FR-014
    expected: Any dynamic loading or virtualisation windows the final derived result instead of filtering only the currently rendered subset.
    verification:
      automated: If dynamic loading or virtualisation is introduced, helper tests prove filtering/searching/sorting run before rendering-window selection.
      manual: With a query that matches an item outside the initial visible window, confirm the item appears after search rather than being missed because it was not rendered initially.
      rationale: Danny wants client-side search while recognising dynamic loading may be the optimum loading-performance path; this pins the architecture boundary.
    integration_isolation: Rendering optimisation only; no server-side search or data-fetch contract change.
  AS-015:
    type: manual
    requirements:
    - FR-015
    expected: The search clear button empties only the search query and preserves all other Order Items by Category controls.
    verification:
      automated: Dashboard component/helper tests cover a non-empty search query with active category, matched-state, sort, and visible-count state, then clear the query and assert those other states are preserved.
      manual: Type a search query, activate a category chip and matched-state/sort control, click the clear button, and confirm the search text clears while the other controls remain active.
      rationale: Danny explicitly requested a clear button for the search box; preserving the other controls prevents it from behaving like a broad reset.
    integration_isolation: Client-side UI state only; no generated-data mutation.

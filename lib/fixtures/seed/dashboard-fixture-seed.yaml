# Delivery template: 1 delivery per trip. The generator picks a
# delivery date that is 1 day before day_index 0 (so the order arrives
# the day before the first meal).
delivery_template:
  order_number_prefix: "TF-DEMO-"  # TF = Tesco Fixture (recognisable prefix)
  delivery_slots: ["8:00-10:00", "10:00-12:00", "12:00-14:00", "14:00-16:00"]

# Coverage window: 8 days starting from a relative offset. The generator
# resolves this to actual ISO dates using the build time.
coverage_window:
  start_offset_days_from_today: 0  # window starts today
  duration_days: 8

# Obvious-fake sentinels. These values are NOT randomised. They are
# written verbatim into the generated JSON so anyone reading the
# fixture immediately knows it is synthetic.
sentinels:
  data_generated_at: "2026-01-01T00:00:00Z"  # recognisably fake
  order_total: 42.42                          # recognisably fake

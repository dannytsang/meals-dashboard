# Delivery template: 1 delivery per trip. The generator picks a
# delivery date that is 1 day before day_index 0 (so the order arrives
# the day before the first meal).
delivery_template:
  # Recognisable "fixture" prefix (Tesco Fixture) — Danny can spot it
  # immediately in any order number on the demo dashboard.
  order_number_prefix: "TF-DEMO-"
  delivery_slots: ["8:00-10:00", "10:00-12:00", "12:00-14:00", "14:00-16:00", "16:00-18:00", "18:00-20:00"]

# Coverage window: 8 days starting from a fixed reference date.
# The generator resolves this to actual ISO dates. The reference date
# is FIXED (not "today") so the generated fixture is byte-identical
# regardless of when the build runs. The "build time" is NOT a
# randomisation input.
coverage_window:
  # ISO date string used as the "today" anchor for the fixture.
  # Picked from the seed so the fixture is stable. NOT randomised.
  reference_date: "2026-06-18"
  duration_days: 8

# Obvious-fake sentinels. These values are NOT randomised. They are
# written verbatim into the generated JSON so anyone reading the
# fixture immediately knows it is synthetic.
sentinels:
  data_generated_at: "2026-01-01T00:00:00Z"  # recognisably fake
  order_total: 42.42                          # recognisably fake
  ui_updated_at: "2026-01-01T00:00:00Z"      # recognisably fake
  # Random number generator seed (NFR-009). Constant so consecutive
  # builds produce byte-identical output. Do NOT change without
  # regenerating the fixture shasum.
  rng_seed: 42
# dashboard-fixture-seed.yaml
#
# Source-of-truth seed file for the demo-mode fixture. The build-time
# generator at lib/fixtures/scripts/generate-fixture.mjs reads this file
# and emits lib/fixtures/dashboard-fixture.json.
#
# The seed captures the *structure* of a real trip (meal slots, items per
# meal, a delivery window, a coverage window). The generator fills in
# realistic-but-synthetic names, dates, times, and locations from the
# curated pools below using a seeded RNG (constant seed 42) so the
# generated JSON is byte-identical across builds.
#
# This file is COMMITTED to the repo. The generated JSON is GITIGNORED
# (see lib/fixtures/.gitignore).

# Curated UK name pool. Used by the generator to fill in `booker` and
# `delivered_to` fields. No "Demo" prefix. Realistic-sounding names.
name_pool:
  first_names: [Sam, Chen, Patel, Singh, Wei, Aisha, Marcus, Priya]
  last_names: [Patel, Singh, Chen, Wei, Khan, Sharma]

# Curated UK delivery location pool. Used by the generator to fill in
# the `delivery_location` field on each order.
location_pool:
  - 14 Beechwood Avenue, London N22
  - 8 Church Lane, Bristol BS8
  - 27 High Street, Manchester M4
  - 5 Park Road, Birmingham B5
  - 12 Riverside Way, Leeds LS1
  - 33 Oak Drive, Edinburgh EH9

# Meal template: 7 meals across 8 days. Day index 0-7 (0 = first day in
# the window). Each entry defines a meal slot with items. Day 3 is the
# "gap day" with no meals — exercises the 0% coverage surface.
meal_template:
  - day_index: 0
    meal_type: dinner
    items: [chicken_breast_500g, garlic_bulb, pasta_500g, tomato_sauce_680g]
  - day_index: 1
    meal_type: lunch
    items: [salad_mix_200g, feta_cheese_200g, olives_200g, bread_loaf]
  - day_index: 2
    meal_type: dinner
    items: [salmon_fillets_300g, broccoli_500g, rice_1kg, lemon_x4]
  # day_index 3 is the gap day (no meals)
  - day_index: 4
    meal_type: lunch
    items: [wrap_tortillas_8pk, hummus_300g, cucumber_x1, peppers_x3]
  - day_index: 5
    meal_type: dinner
    items: [beef_mince_500g, onion_x3, carrot_500g, stock_cubes_8pk]
  - day_index: 6
    meal_type: lunch
    items: [eggs_x12, bacon_300g, bread_loaf, butter_250g]
  - day_index: 7
    meal_type: dinner
    items: [cod_fillets_300g, peas_500g, potatoes_1kg, mint_sauce_200g]

